<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature's Select - Catálogo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-800 font-sans">

    <!-- Header / Barra Superior -->
    <header class="bg-emerald-800 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wide">Nature's Select</h1>
            <button onclick="toggleCarrito()" class="bg-emerald-700 hover:bg-emerald-600 px-4 py-2 rounded-lg flex items-center gap-2 transition shadow">
                🛒 Carrito <span id="contador-carrito" class="bg-white text-emerald-900 px-2 py-0.5 rounded-full text-xs font-bold">0</span>
            </button>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <h2 class="text-3xl font-bold text-stone-900 mb-6 text-center">Nuestro Catálogo</h2>
        <div id="contenedor-productos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Los productos se cargan dinámicamente aquí -->
        </div>
    </main>

    <!-- Panel / Modal del Carrito -->
    <div id="modal-carrito" class="fixed inset-0 bg-black/50 hidden z-50 flex justify-end">
        <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col p-6">
            <div class="flex justify-between items-center border-b pb-4">
                <h3 class="text-xl font-bold text-stone-900">Tu Carrito de Compras</h3>
                <button onclick="toggleCarrito()" class="text-stone-500 hover:text-stone-800 text-2xl font-bold">&times;</button>
            </div>
            <div id="lista-carrito" class="flex-1 overflow-y-auto py-4 space-y-4">
                <!-- Items seleccionados -->
            </div>
            <div class="border-t pt-4">
                <div class="flex justify-between text-lg font-bold mb-4">
                    <span>Total:</span>
                    <span id="total-carrito">$0.00</span>
                </div>
                <button onclick="enviarPedidoWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition shadow">
                    Enviar pedido por WhatsApp 📱
                </button>
            </div>
        </div>
    </div>

    <!-- Modal para ver imagen en grande (Lightbox) -->
    <div id="modal-imagen" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center p-4" onclick="cerrarImagenGrande()">
        <div class="relative max-w-2xl w-full flex justify-center" onclick="event.stopPropagation()">
            <button onclick="cerrarImagenGrande()" class="absolute -top-10 right-0 text-white text-3xl font-bold px-2">&times;</button>
            <img id="imagen-ampliada" src="" alt="Imagen ampliada" class="max-h-[85vh] max-w-full rounded-xl object-contain shadow-2xl">
        </div>
    </div>

    <!-- Lógica de JavaScript -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxxgJ_D5-fF4xu1OzzPURgktY3FzrLuu26tJxh09YsYKnTD_Lx5d4uewDHjhBZ7gUOUcQ/exec"; 
        let carrito = [];
        let productosGlobal = [];

        async function cargarProductos() {
            try {
                const respuesta = await fetch(API_URL);
                const productos = await respuesta.json();
                productosGlobal = productos;
                renderizarProductos(productos);
            } catch (error) {
                console.error("Error al cargar productos:", error);
            }
        }

        function renderizarProductos(productos) {
            const contenedor = document.getElementById("contenedor-productos");
            contenedor.innerHTML = "";

            productos.forEach((prod, index) => {
                let imagenesHtml = "";

                // Soporte para dos imágenes (Columna G e H) con evento para abrir en grande
                if (prod.imagen1 && prod.imagen2) {
                    imagenesHtml = `
                        <div class="grid grid-cols-2 gap-1 h-48 bg-stone-100 overflow-hidden">
                            <img src="${prod.imagen1}" alt="${prod.nombre} 1" class="w-full h-full object-cover cursor-pointer hover:opacity-90 transition" onclick="abrirImagenGrande('${prod.imagen1}')">
                            <img src="${prod.imagen2}" alt="${prod.nombre} 2" class="w-full h-full object-cover cursor-pointer hover:opacity-90 transition" onclick="abrirImagenGrande('${prod.imagen2}')">
                        </div>
                    `;
                } else if (prod.imagen1) {
                    imagenesHtml = `
                        <div class="w-full h-48 overflow-hidden bg-stone-100">
                            <img src="${prod.imagen1}" alt="${prod.nombre}" class="w-full h-full object-cover cursor-pointer hover:opacity-90 transition" onclick="abrirImagenGrande('${prod.imagen1}')">
                        </div>
                    `;
                } else {
                    imagenesHtml = `<div class="w-full h-48 bg-stone-200 flex items-center justify-center text-stone-400 text-sm">Sin imagen</div>`;
                }

                const card = document.createElement("div");
                card.className = "bg-white rounded-2xl shadow-md overflow-hidden flex flex-col justify-between border border-stone-100";
                card.innerHTML = `
                    <div>
                        ${imagenesHtml}
                        <div class="p-5">
                            <h3 class="font-bold text-xl text-stone-900 mb-1">${prod.nombre}</h3>
                            <p class="text-stone-600 text-sm mb-4">${prod.beneficio || ''}</p>
                        </div>
                    </div>
                    <div class="p-5 pt-0 flex items-center justify-between">
                        <span class="text-2xl font-black text-emerald-700">$${Number(prod.precio).toFixed(2)}</span>
                        <button onclick="agregarAlCarrito(${index})" class="bg-emerald-700 hover:bg-emerald-800 text-white px-4 py-2 rounded-xl font-medium transition shadow-sm">
                            Agregar 🛒
                        </button>
                    </div>
                `;
                contenedor.appendChild(card);
            });
        }

        // Funciones del Lightbox (Ver imagen en grande)
        function abrirImagenGrande(url) {
            if (!url) return;
            document.getElementById('imagen-ampliada').src = url;
            document.getElementById('modal-imagen').classList.remove('hidden');
        }

        function cerrarImagenGrande() {
            document.getElementById('modal-imagen').classList.add('hidden');
        }

        // Funciones del Carrito
        function toggleCarrito() {
            const modal = document.getElementById("modal-carrito");
            modal.classList.toggle("hidden");
        }

        function agregarAlCarrito(index) {
            const producto = productosGlobal[index];
            const itemExistente = carrito.find(item => item.nombre === producto.nombre);
            
            if (itemExistente) {
                itemExistente.cantidad += 1;
            } else {
                carrito.push({ ...producto, cantidad: 1 });
            }
            actualizarCarrito();
        }

        function actualizarCarrito() {
            const lista = document.getElementById("lista-carrito");
            const contador = document.getElementById("contador-carrito");
            const totalSpan = document.getElementById("total-carrito");
            
            lista.innerHTML = "";
            let total = 0;
            let totalItems = 0;

            carrito.forEach((item, index) => {
                total += item.precio * item.cantidad;
                totalItems += item.cantidad;

                const div = document.createElement("div");
                div.className = "flex justify-between items-center bg-stone-50 p-3 rounded-xl border";
                div.innerHTML = `
                    <div>
                        <h4 class="font-bold text-sm text-stone-800">${item.nombre}</h4>
                        <p class="text-xs text-stone-500">$${item.precio} x ${item.cantidad}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="cambiarCantidad(${index}, -1)" class="bg-stone-200 hover:bg-stone-300 px-2.5 py-1 rounded-lg text-xs font-bold">-</button>
                        <span class="text-sm font-bold w-4 text-center">${item.cantidad}</span>
                        <button onclick="cambiarCantidad(${index}, 1)" class="bg-stone-200 hover:bg-stone-300 px-2.5 py-1 rounded-lg text-xs font-bold">+</button>
                    </div>
                `;
                lista.appendChild(div);
            });

            contador.innerText = totalItems;
            totalSpan.innerText = `$${total.toFixed(2)}`;
        }

        function cambiarCantidad(index, delta) {
            carrito[index].cantidad += delta;
            if (carrito[index].cantidad <= 0) {
                carrito.splice(index, 1);
            }
            actualizarCarrito();
        }

        function enviarPedidoWhatsApp() {
            if (carrito.length === 0) {
                alert("Tu carrito está vacío.");
                return;
            }

            let mensaje = "Hola, ¡quiero hacer el siguiente pedido desde el catálogo:%0A";
            let total = 0;

            carrito.forEach(item => {
                let subtotal = item.precio * item.cantidad;
                total += subtotal;
                mensaje += `- ${item.cantidad}x ${item.nombre} ($${subtotal.toFixed(2)})%0A`;
            });

            mensaje += `%0A*Total a pagar: $${total.toFixed(2)}*`;

            const numeroWhatsApp = "523312345678"; // Reemplaza con tu número de WhatsApp
            window.open(`https://wa.me/${numeroWhatsApp}?text=${mensaje}`, '_blank');
        }

        cargarProductos();
    </script>
</body>
</html>
